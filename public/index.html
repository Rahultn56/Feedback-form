<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Form - MongoDB Integration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; color: #1f2937; padding: 24px 16px; }
    .container { max-width: 680px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 26px; color: #111827; }
    .header p { color: #6b7280; font-size: 14px; margin-top: 4px; }
    .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08); margin-bottom: 24px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #374151; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    input:focus, select:focus, textarea:focus { border-color: #2563eb; outline: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button.btn { width: 100%; background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button.btn:hover { background: #1d4ed8; }
    .alert { padding: 12px; border-radius: 6px; margin-bottom: 16px; display: none; font-size: 14px; font-weight: 500; }
    .alert-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .feed-item { border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; margin-bottom: 10px; background: #fafafa; }
    .feed-top { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
    .feed-msg { color: #374151; font-size: 14px; margin-bottom: 6px; }
    .feed-date { font-size: 11px; color: #9ca3af; }
    .badge { background: #e0e7ff; color: #3730a3; padding: 2px 6px; border-radius: 10px; font-size: 11px; margin-left: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💬 Feedback Form</h1>
      <p>Direct MongoDB Integration with Express API</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <div class="card">
      <form id="feedbackForm">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="name" required placeholder="Your Name" />
        </div>
        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" id="email" required placeholder="your.email@example.com" />
        </div>
        <div class="grid">
          <div class="form-group">
            <label>Category</label>
            <select id="category">
              <option value="General">General</option>
              <option value="Suggestion">Suggestion</option>
              <option value="Bug Report">Bug Report</option>
              <option value="Praise">Praise</option>
            </select>
          </div>
          <div class="form-group">
            <label>Rating (1-5)</label>
            <select id="rating">
              <option value="5">⭐⭐⭐⭐⭐ (5)</option>
              <option value="4">⭐⭐⭐⭐ (4)</option>
              <option value="3">⭐⭐⭐ (3)</option>
              <option value="2">⭐⭐ (2)</option>
              <option value="1">⭐ (1)</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Feedback Message *</label>
          <textarea id="message" rows="4" required placeholder="Write your feedback details here..."></textarea>
        </div>
        <button type="submit" id="submitBtn" class="btn">Submit Feedback</button>
      </form>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h3 style="font-size: 17px;">Stored Feedback in Database</h3>
        <button onclick="loadFeedback()" style="background:#e5e7eb; border:none; padding:4px 10px; border-radius:4px; cursor:pointer;">Refresh</button>
      </div>
      <div id="feedbackContainer">Loading feedbacks from MongoDB...</div>
    </div>
  </div>

  <script>
    const alertBox = document.getElementById('alertBox');
    const form = document.getElementById('feedbackForm');

    async function loadFeedback() {
      try {
        const res = await fetch('/api/feedback');
        const data = await res.json();
        const container = document.getElementById('feedbackContainer');
        if (data.data && data.data.length > 0) {
          container.innerHTML = data.data.map(item => `
            <div class="feed-item">
              <div class="feed-top">
                <span><strong>${item.name}</strong> <span class="badge">${item.category}</span></span>
                <span>${'⭐'.repeat(item.rating || 5)}</span>
              </div>
              <div class="feed-msg">${item.message}</div>
              <div class="feed-date">${item.email} • ${new Date(item.createdAt).toLocaleString()}</div>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p style="color:#6b7280; font-style:italic;">No feedbacks recorded in MongoDB yet.</p>';
        }
      } catch (e) {
        document.getElementById('feedbackContainer').innerHTML = '<p style="color:#ef4444;">Failed to load feedbacks from database.</p>';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Saving to MongoDB...';
      btn.disabled = true;

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        category: document.getElementById('category').value,
        rating: Number(document.getElementById('rating').value),
        message: document.getElementById('message').value
      };

      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alertBox.className = 'alert alert-success';
          alertBox.style.display = 'block';
          alertBox.innerText = '✅ Thank you! Feedback saved to MongoDB successfully.';
          form.reset();
          loadFeedback();
        } else {
          throw new Error(data.message || 'Submission failed');
        }
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.style.display = 'block';
        alertBox.innerText = '❌ Error: ' + err.message;
      } finally {
        btn.innerText = 'Submit Feedback';
        btn.disabled = false;
      }
    });

    loadFeedback();
  </script>
</body>
</html>
